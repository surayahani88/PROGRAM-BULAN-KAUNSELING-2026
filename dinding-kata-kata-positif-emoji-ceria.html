<!doctype html><html lang='ms'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dinding Kata-Kata Positif Digital</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f5e8ff,#e9f7ff,#fff2cf);color:#3d2b56}header{text-align:center;padding:28px 12px}h1{color:#713bc1}.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:330px 1fr;gap:20px;padding:0 18px 40px}.panel,.wall{background:#ffffffdd;border-radius:22px;padding:20px;box-shadow:0 10px 28px #54327722}label{font-weight:bold;display:block;margin:12px 0 6px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:2px solid #d9c7f4;border-radius:12px;font:inherit}textarea{min-height:100px}.emojis{display:flex;gap:7px;flex-wrap:wrap}.emoji{font-size:30px;border:2px solid transparent;border-radius:10px;padding:7px;background:#f1e8ff}.emoji.active{border-color:#713bc1}.send{width:100%;padding:13px;margin-top:15px;border:0;border-radius:14px;background:#713bc1;color:white;font-weight:bold;font-size:17px}.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px}.note{min-height:155px;padding:16px;border-radius:8px 18px;box-shadow:0 7px 15px #3332;position:relative}.note:nth-child(5n+1){background:#fff1a8}.note:nth-child(5n+2){background:#d9f7e8}.note:nth-child(5n+3){background:#ffddeb}.note:nth-child(5n+4){background:#dcecff}.note:nth-child(5n){background:#eadcff}.msg{font-size:17px;font-weight:bold;margin:8px 0 30px}.meta{position:absolute;bottom:10px;font-size:12px;opacity:.7}.counter{font-weight:bold;background:#eee3ff;display:inline-block;padding:7px 12px;border-radius:20px}.small{font-size:12px;color:#705e82;margin-top:10px}@media(max-width:760px){.wrap{grid-template-columns:1fr}}</style></head><body><header><h1>🌈 Dinding Kata-Kata Positif Digital 🌈</h1><b>Bulan Kaunseling Kebangsaan 2026 • Sebarkan kata baik, cerahkan hari seseorang ✨</b><div style='text-align:center;font-size:30px;letter-spacing:8px;margin:-4px 0 14px'>😊 🌟 💖 🌈 💪 🎉 🦋 🏆</div></header><main class='wrap'><section class='panel'><h2>💌 Kongsi Kata Positif</h2><label>Nama (pilihan)</label><input id='name' maxlength='30' placeholder='Contoh: Aina'><label>Kelas</label><input id='kelas' maxlength='20' placeholder='Contoh: 5 Bestari'><label>Kategori</label><select id='cat'><option>Semangat Saya</option><option>Penghargaan Untuk Kawan</option><option>Saya Hebat Kerana…</option><option>Hari Ini Saya Bersyukur…</option><option>Pesanan Positif Hari Ini</option></select><label>Pilih emoji</label><div class='emojis'>
<button class='emoji active' data-e='😊'>😊</button><button class='emoji' data-e='😄'>😄</button>
<button class='emoji' data-e='🥰'>🥰</button><button class='emoji' data-e='🤩'>🤩</button>
<button class='emoji' data-e='😍'>😍</button><button class='emoji' data-e='😎'>😎</button>
<button class='emoji' data-e='🤗'>🤗</button><button class='emoji' data-e='🌟'>🌟</button>
<button class='emoji' data-e='⭐'>⭐</button><button class='emoji' data-e='✨'>✨</button>
<button class='emoji' data-e='❤️'>❤️</button><button class='emoji' data-e='💖'>💖</button>
<button class='emoji' data-e='💪'>💪</button><button class='emoji' data-e='👏'>👏</button>
<button class='emoji' data-e='👍'>👍</button><button class='emoji' data-e='🎉'>🎉</button>
<button class='emoji' data-e='🏆'>🏆</button><button class='emoji' data-e='🌈'>🌈</button>
<button class='emoji' data-e='🌻'>🌻</button><button class='emoji' data-e='🦋'>🦋</button>
<button class='emoji' data-e='☀️'>☀️</button><button class='emoji' data-e='💡'>💡</button>
</div><label>Kata-kata positif</label><textarea id='msg' maxlength='180' placeholder='Contoh: Saya percaya saya boleh berjaya!'></textarea><button class='send' id='send'>✨ HANTAR KE DINDING</button><div class='small'>Versi demo: respons disimpan pada browser/peranti ini sahaja.</div></section><section class='wall'><h2>✨ Dinding Positif Kita</h2><div class='counter' id='counter'></div><br><br><div class='notes' id='notes'></div></section></main><script>const KEY='dindingPositif2026';let chosen='😊';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelectorAll('.emoji').forEach(b=>b.onclick=()=>{document.querySelectorAll('.emoji').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosen=b.dataset.e});function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function render(){let a=load(),box=document.getElementById('notes');document.getElementById('counter').textContent=a.length+' mesej';box.innerHTML=a.length?a.slice().reverse().map(x=>`<div class='note'><div style='font-size:42px;text-align:center;margin-bottom:5px'>${esc(x.e)}</div><div class='msg'>${esc(x.msg)}</div><div class='meta'>${esc(x.cat)}<br>${x.name?esc(x.name)+' • ':''}${esc(x.kelas||'Kelas tidak dinyatakan')}</div></div>`).join(''):'🌟 Dinding masih kosong. Jadilah orang pertama yang berkongsi kata-kata positif!'}document.getElementById('send').onclick=()=>{let msg=document.getElementById('msg').value.trim();if(!msg){alert('Sila tulis kata-kata positif dahulu 😊');return}let a=load();a.push({name:document.getElementById('name').value.trim(),kelas:document.getElementById('kelas').value.trim(),cat:document.getElementById('cat').value,e:chosen,msg});localStorage.setItem(KEY,JSON.stringify(a));document.getElementById('msg').value='';document.getElementById('name').value='';render()};render();</script></body></html>
