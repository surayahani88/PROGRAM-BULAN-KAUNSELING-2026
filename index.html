<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Bulan Kaunseling 2026</title><script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>*{font-family:'Plus Jakarta Sans',sans-serif;scroll-behavior:smooth}body{background:radial-gradient(circle at 10% 10%,#f3e8ff 0,transparent 34%),radial-gradient(circle at 90% 20%,#dbeafe 0,transparent 35%),linear-gradient(135deg,#fff,#f5f3ff);color:#3b2755}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8)}.float{animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-5px)}}.fade{animation:a .35s ease}@keyframes a{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style></head>
<body class="min-h-screen flex flex-col">
<header class="glass sticky top-0 z-40 shadow-sm"><div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
<div onclick="go('home')" class="flex items-center gap-3 cursor-pointer"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 text-white grid place-items-center text-xl shadow-lg"><i class="fa-solid fa-heart"></i></div><div><h1 class="font-black text-sm sm:text-xl text-purple-950">PROGRAM BULAN KAUNSELING 2026</h1><p class="text-[10px] sm:text-xs font-bold text-purple-600 uppercase tracking-wider">Unit Bimbingan & Kaunseling</p></div></div>
<button onclick="go('home')" class="w-10 h-10 rounded-xl bg-purple-100 text-purple-700"><i class="fa-solid fa-house"></i></button></div></header>
<main id="app" class="flex-1 max-w-6xl w-full mx-auto px-4 py-8"></main>
<footer class="bg-gradient-to-r from-purple-900 to-indigo-900 text-white mt-8"><div class="max-w-6xl mx-auto px-4 py-8 text-center"><p class="font-extrabold">UNIT BIMBINGAN DAN KAUNSELING</p><p class="text-xs text-purple-200 mt-1">Minda Sihat • Emosi Sejahtera • Hidup Ceria</p><p class="text-[11px] text-purple-300 mt-5">© 2026 Program Bulan Kaunseling. Hak Cipta Terpelihara.</p></div></footer>
<script>
const activities=[
{id:'termometer',icon:'🌡️',title:'Termometer Emosi Saya',desc:'Kenal pasti dan rekod emosi anda hari ini.',tag:'Emosi',color:'from-pink-500 to-rose-500'},
{id:'roda',icon:'🎡',title:'Roda Emosi & Mood Check-In',desc:'Pilih emosi dan buat semakan mood secara interaktif.',tag:'Interaktif',color:'from-violet-500 to-purple-600'},
{id:'cermin',icon:'🪞',title:'Cermin Diri Positif',desc:'Kenali kekuatan diri dan bina keyakinan positif.',tag:'Kendiri',color:'from-blue-500 to-cyan-500'},
{id:'dinding',icon:'💬',title:'Dinding Kata-Kata Positif',desc:'Kongsi kata-kata positif untuk menceriakan warga sekolah.',tag:'Positiviti',color:'from-amber-400 to-orange-500'},
{id:'kuiz',icon:'🧠',title:'Kuiz Minda Sihat',desc:'Uji pengetahuan tentang emosi, kesejahteraan dan minda sihat.',tag:'Kuiz',color:'from-emerald-500 to-teal-500'}
];
function card(x){return `<button onclick="go('activity','${x.id}')" class="glass group rounded-3xl p-5 text-left shadow-md hover:shadow-xl hover:-translate-y-1 transition relative overflow-hidden"><div class="absolute -right-5 -bottom-6 text-8xl opacity-10">${x.icon}</div><div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${x.color} text-white grid place-items-center text-3xl shadow-lg mb-4">${x.icon}</div><span class="text-[10px] font-black uppercase tracking-widest text-purple-600">${x.tag}</span><h3 class="text-lg font-black text-purple-950 mt-1">${x.title}</h3><p class="text-xs text-purple-700 mt-2 leading-relaxed">${x.desc}</p><div class="mt-5 pt-3 border-t border-purple-100 flex justify-between text-xs font-bold text-purple-600"><span>Buka Aktiviti</span><i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i></div></button>`}
function home(){document.title='Program Bulan Kaunseling 2026';app.innerHTML=`<section class="fade text-center"><div class="max-w-3xl mx-auto"><span class="inline-block bg-purple-100 text-purple-700 rounded-full px-4 py-2 text-xs font-black tracking-widest uppercase">🌈 Bulan Kaunseling 2026 🌈</span><h2 class="text-4xl sm:text-6xl font-black text-purple-950 mt-5 leading-tight">Minda Sihat,<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600">Emosi Sejahtera</span></h2><p class="text-purple-700 mt-4 max-w-xl mx-auto">Portal aktiviti digital Unit Bimbingan & Kaunseling untuk membina murid yang positif, yakin dan sejahtera.</p></div>
<div class="glass rounded-3xl shadow-xl p-6 sm:p-10 mt-9 max-w-4xl mx-auto relative overflow-hidden"><div class="text-7xl float">🧑‍🤝‍🧑</div><h3 class="font-black text-2xl sm:text-3xl text-purple-950 mt-4">Jom Sertai Aktiviti!</h3><p class="text-sm text-purple-600 mt-2">Pilih aktiviti di bawah dan sertai menggunakan telefon, tablet atau komputer.</p></div>
<div class="mt-12"><h3 class="text-2xl sm:text-3xl font-black text-purple-950">AKTIVITI BULAN KAUNSELING</h3><p class="text-xs text-purple-600 mt-1">Klik kad untuk membuka aktiviti</p><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6">${activities.map(card).join('')}</div></div>
<div class="glass rounded-3xl p-6 mt-10 max-w-4xl mx-auto"><div class="grid sm:grid-cols-3 gap-5"><div><div class="text-3xl">💜</div><b class="text-sm">Kenali Emosi</b></div><div><div class="text-3xl">🌱</div><b class="text-sm">Bina Diri Positif</b></div><div><div class="text-3xl">🤝</div><b class="text-sm">Saling Menyokong</b></div></div></div></section>`}
function activity(id){let x=activities.find(a=>a.id===id);if(!x)return home();document.title=x.title+' | Bulan Kaunseling 2026';app.innerHTML=`<section class="fade max-w-4xl mx-auto"><button onclick="go('home')" class="bg-white border border-purple-200 rounded-full px-4 py-2 text-xs font-extrabold text-purple-800"><i class="fa-solid fa-arrow-left mr-2"></i>Kembali</button><div class="glass rounded-3xl shadow-xl p-7 sm:p-10 mt-6 text-center"><div class="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-br ${x.color} grid place-items-center text-5xl shadow-lg">${x.icon}</div><span class="inline-block mt-6 text-[10px] uppercase tracking-widest font-black text-purple-600">${x.tag}</span><h2 class="text-3xl sm:text-5xl font-black text-purple-950 mt-2">${x.title}</h2><p class="text-sm text-purple-700 mt-4 max-w-xl mx-auto">${x.desc}</p><div class="bg-purple-50 border border-purple-100 rounded-2xl p-5 mt-8"><p class="font-extrabold text-purple-950">Aktiviti digital akan dibuka di sini</p><p class="text-xs text-purple-600 mt-2">Pautan Google Form / permainan / dashboard boleh dimasukkan pada butang ini.</p><button onclick="alert('Pautan aktiviti belum ditetapkan.')" class="mt-5 px-6 py-3 rounded-2xl bg-gradient-to-r ${x.color} text-white text-sm font-extrabold shadow-lg"><i class="fa-solid fa-play mr-2"></i>MULA AKTIVITI</button></div></div></section>`}
function go(page,id){if(page==='activity'){history.pushState({},'', '?aktiviti='+id);activity(id)}else{history.pushState({},'',location.pathname);home()}scrollTo({top:0,behavior:'smooth'})}
onpopstate=()=>init();function init(){let id=new URLSearchParams(location.search).get('aktiviti');id?activity(id):home()}init();
</script></body></html>
